[package]
name = "aptoza"
version = "1.0.6"
edition = "2021"
authors = ["Emrullah ALKAÇ"]
description = "Aptoza - Modern ekran kaydedici, video/ses editörü (Rust / egui)"
license = "MIT"
repository = "https://github.com/emralkac21/AptozaQ3"
homepage = "https://github.com/emralkac21/AptozaQ3"
readme = "README.md"
keywords = ["screen-recorder", "video-editor", "timeline", "egui", "ffmpeg"]
categories = ["multimedia::video", "gui"]

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"] }
egui = "0.31.1"
rfd = { version = "0.15.4", default-features = false }
xcap = "0.4.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
crossbeam-channel = "0.5.17"
tempfile = "3.20"
chrono = "0.4.45"
dirs = "7.0.0"
ab_glyph = "0.2.32"
global-hotkey = "0.8.0"
webbrowser = "1.2.5"
ico = "0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
