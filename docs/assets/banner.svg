<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">AptozaQ3 — Ekran Kaydedici, Video ve Ses Editörü</title>
  <desc id="desc">Koyu lacivert arka plan üzerinde AptozaQ3 logosu ve açıklaması.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <g opacity="0.22" stroke="#7dd3fc" stroke-width="1">
    <path d="M0 350 L1280 180"/>
    <path d="M0 390 L1280 220"/>
    <path d="M980 0 L1180 420"/>
    <path d="M1080 0 L1280 420"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="112" height="112" rx="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M104 142 L126 112 L148 142 Z" fill="url(#accent)"/>
    <circle cx="150" cy="106" r="8" fill="#f472b6"/>
    <rect x="100" y="152" width="56" height="6" rx="3" fill="#38bdf8" opacity="0.8"/>
  </g>

  <text x="218" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">
    Aptoza<tspan fill="#38bdf8">Q3</tspan>
  </text>

  <text x="220" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#cbd5e1">
    Ekran Kaydedici · Video &amp; Ses Editörü
  </text>

  <rect x="220" y="210" width="760" height="2" fill="url(#accent)" opacity="0.9"/>

  <text x="220" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#94a3b8">
    Rust + egui + FFmpeg · Windows 10/11 · Açık kaynak (MIT)
  </text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="17">
    <rect x="220" y="292" width="150" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
    <text x="295" y="317" text-anchor="middle" fill="#7dd3fc">Ekran Kaydı</text>

    <rect x="386" y="292" width="168" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
    <text x="470" y="317" text-anchor="middle" fill="#a5b4fc">Timeline</text>

    <rect x="570" y="292" width="176" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
    <text x="658" y="317" text-anchor="middle" fill="#f9a8d4">Ses Efektleri</text>

    <rect x="762" y="292" width="164" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
    <text x="844" y="317" text-anchor="middle" fill="#86efac">Kalem</text>
  </g>

  <text x="1208" y="372" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">
    github.com/emrullahalkac72-beep/AptozaQ3
  </text>
</svg>
